# Restore the full TF-M configuration (see the nordic-tfm-full snippet).
#
# The nRF91 boards default to the minimal TF-M profile with BL2 disabled.
# Selecting the base profile brings back all secure services, and re-enabling
# BL2 restores the bootloader that the full flash layout reserves room for.
CONFIG_TFM_PROFILE_TYPE_NOT_SET=y
CONFIG_TFM_BL2=y
